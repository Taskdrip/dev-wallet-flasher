kind = "web"
previewPath = "/"
title = "Dev Wallet Connector"
version = "1.0.0"
id = "artifacts/dev-wallet"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20605

[services.development]
run = "pnpm --filter @workspace/dev-wallet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dev-wallet", "run", "build" ]
publicDir = "artifacts/dev-wallet/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20605"
BASE_PATH = "/"
